name: Automation Gateway CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify application import
        run: python -c "from automation_gateway.app import app; assert app.title == 'Automation Gateway'"

      - name: Run tests
        run: python -m pytest

      - name: Build container image
        run: docker build --tag automation-gateway:ci .
